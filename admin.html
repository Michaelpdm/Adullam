<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Admin — Adullam Services</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
</head>
<body>

<main id="login" class="center">
  <form id="lf" class="panel">
    <h1>🔒 Admin</h1>
    <p class="muted">Enter your admin password to see your requests.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="lerr" class="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="bar">
    <div><b>Requests</b> <span id="newBadge" class="badge" hidden></span></div>
    <div class="acts">
      <button class="btn ghost sm" id="refresh">↻ Refresh</button>
      <button class="btn ghost sm" id="logout">Sign out</button>
    </div>
  </header>

  <div class="wrap">
    <section class="stats" id="stats"></section>
    <div class="tools">
      <div class="chips" id="chips"></div>
      <input id="q" type="search" placeholder="Search name, contact, message…">
    </div>
    <p id="state" class="muted"></p>
    <div id="list"></div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
